name: Bootstrap Filament dependency

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: filament-overhaul/phase-1
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Resolve Filament dependencies
        run: composer update filament/filament --with-all-dependencies --no-interaction --prefer-dist

      - name: Commit composer.lock
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore(filament): lock Filament 5 dependencies"
          git push origin HEAD:filament-overhaul/phase-1
