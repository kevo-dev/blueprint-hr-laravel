name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Laravel tests and security checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: blueprint_hr_test
          MYSQL_USER: blueprint_hr
          MYSQL_PASSWORD: blueprint_hr_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, gd, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer dependency audit
        run: composer audit --no-interaction

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
        env:
          APP_ENV: testing
          APP_DEBUG: true
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: blueprint_hr_test
          DB_USERNAME: blueprint_hr
          DB_PASSWORD: blueprint_hr_password
          QUEUE_CONNECTION: sync

      - name: Run migrations and seeders
        run: php artisan migrate:fresh --seed --force
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: blueprint_hr_test
          DB_USERNAME: blueprint_hr
          DB_PASSWORD: blueprint_hr_password
          BLUEPRINT_DEMO_PASSWORD: ci-only-demo-password

      - name: PHP syntax checks
        run: find app database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run authorization and application tests
        run: php artisan test --no-interaction
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: blueprint_hr_test
          DB_USERNAME: blueprint_hr
          DB_PASSWORD: blueprint_hr_password
          QUEUE_CONNECTION: sync

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: NPM production dependency audit
        run: npm audit --omit=dev
